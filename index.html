<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <title>أستاذ الشارع | GESTION</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --neon-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #dc3545;
            --success: #28a745;
            --warning: #ffb020;
        }
        * { box-sizing: border-box; font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { background-color: var(--bg-color); }
        body { color: var(--text-main); padding-bottom: calc(80px + env(safe-area-inset-bottom)); min-height: 100vh; }

        /* Header & Dashboard */
        .header { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top)); border-bottom: 2px solid var(--neon-pink); background: #000; position: relative; }
        .header img { width: 54px; height: 54px; border-radius: 50%; box-shadow: 0 0 12px rgba(255,0,127,0.45); }
        .logo-text { font-size: 24px; font-weight: 900; color: var(--neon-pink); text-shadow: 0 0 10px rgba(255,0,127,0.5); line-height: 1.1; }
        .logo-sub { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 2px; }
        #installBtn { display: none; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: var(--neon-pink); color: #fff; font-size: 12px; padding: 8px 10px; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 8px; background: var(--card-bg); margin-bottom: 14px; gap: 6px; }
        .stat-box { text-align: center; border-radius: 10px; padding: 4px; }
        .stat-box.clickable { cursor: pointer; background: rgba(255,0,127,0.08); border: 1px solid rgba(255,0,127,0.35); }
        .stat-num { font-size: 22px; font-weight: bold; color: var(--neon-pink); }
        .stat-label { font-size: 12px; color: var(--text-muted); }

        /* Layout */
        .container { padding: 10px; max-width: 600px; margin: auto; }
        button { border: none; border-radius: 8px; cursor: pointer; font-weight: bold; padding: 10px 15px; transition: 0.2s; font-size: 14px; }
        button:active { transform: scale(0.97); }
        .btn-neon { background-color: var(--neon-pink); color: #fff; box-shadow: 0 0 8px rgba(255,0,127,0.4); width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-action { background-color: #333; color: #fff; }
        .btn-pay { background-color: rgba(40, 167, 69, 0.2); color: var(--success); border: 1px solid var(--success); flex: 2; }
        .btn-danger { background-color: rgba(220, 53, 69, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid #444; }

        .search { position: relative; margin-bottom: 4px; }
        .search input { padding-right: 40px; margin-bottom: 0; }
        .search span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); opacity: .6; }

        .banner { background: rgba(255,176,32,0.12); border: 1px solid var(--warning); color: var(--warning); border-radius: 10px; padding: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
        .banner button { background: var(--warning); color: #000; padding: 8px 12px; white-space: nowrap; }

        /* Groups & Students */
        .group-card { background: var(--card-bg); border-radius: 12px; margin-bottom: 15px; overflow: hidden; border: 1px solid #333; }
        .group-header { padding: 15px; background: #2a2a2a; display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 8px; }
        .group-title { font-size: 17px; font-weight: bold; }
        .group-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .type-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid #555; color: #ddd; margin-left: 6px; }
        .type-badge.special { border-color: var(--neon-pink); color: var(--neon-pink); }
        .group-content { padding: 15px; display: none; }
        .group-content.active { display: block; }
        .group-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .group-controls button { padding: 10px 6px; }

        .student-card { background: #252525; padding: 14px; border-radius: 8px; margin-bottom: 10px; border-right: 4px solid #555; }
        .debt-alert { border-right-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,0,127,0.2); }
        .student-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 17px; font-weight: bold; }
        .debt-badge { background: var(--neon-pink); color: #fff; padding: 3px 9px; border-radius: 20px; font-size: 12px; white-space: nowrap; }
        .student-stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--text-muted); }
        .student-actions { display: flex; gap: 6px; }
        .empty { text-align: center; color: #777; padding: 10px; }

        /* Inputs */
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; font-size: 16px; }
        label.field { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 15px; width: 92%; max-width: 560px; max-height: 88vh; overflow-y: auto; border: 1px solid var(--neon-pink); }
        .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-modal { color: var(--danger); font-size: 28px; cursor: pointer; font-weight: bold; line-height: 1; padding: 0 6px; }

        .att-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; cursor: pointer; }
        .att-item input[type="checkbox"] { width: 25px; height: 25px; accent-color: var(--neon-pink); margin: 0; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid #333; cursor: pointer; gap: 8px; }
        .muted { color: var(--text-muted); font-size: 13px; }
        h4 { margin: 18px 0 6px; color: var(--neon-pink); }

        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { padding: 9px 6px; text-align: right; border-bottom: 1px solid #333; font-size: 14px; }
        th { color: var(--text-muted); font-weight: normal; }
        .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .summary div { background: #252525; border-radius: 8px; padding: 8px 4px; font-size: 12px; color: var(--text-muted); }
        .summary b { display: block; font-size: 18px; color: #fff; }

        /* Footer */
        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; border-top: 1px solid #333; z-index: 10; }
        .footer button { flex: 1; font-size: 13px; padding: 10px 6px; }

        .toast { position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 14px; border-radius: 10px; display: none; align-items: center; gap: 12px; z-index: 2000; font-weight: bold; box-shadow: 0 4px 20px rgba(0,0,0,.5); width: max-content; max-width: 92%; }
        .toast.show { display: flex; }
        .toast button { background: var(--neon-pink); color: #fff; padding: 6px 12px; }

        /* Print */
        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            html, body { background: #fff; color: #000; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; direction: rtl; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            .print-table th, .print-table td { border: 1px solid #000; padding: 12px; text-align: center; color: #000; }
            .print-header { text-align: center; margin-bottom: 20px; color: #000; }
            .print-logo { font-size: 30px; font-weight: bold; }
        }
    </style>
</head>

    </div>

    <script>
    /* ================= Helpers ================= */
    const STORE_KEY = 'ostadh_db';
    const BACKUP_KEY = 'ostadh_last_backup';
    const PRICES = { normal: 2000, special: 4000 };
    const TYPE_LABEL = { normal: 'عادي', special: 'خاص' };
    const MONTHS = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

    const $ = id => document.getElementById(id);
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' دج';
    function today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
    const monthLabel = ym => { const [y, m] = ym.split('-'); return MONTHS[+m - 1] + ' ' + y; };

    /* ================= Data ================= */
    function migrate(raw) {
        if (!raw || !Array.isArray(raw.groups)) throw new Error('invalid');
        if (raw.version === 2) {
            raw.groups.forEach(g => {
                g.id = g.id || uid(); g.type = g.type || 'normal'; g.price = +g.price || PRICES[g.type];
                g.sessions = Array.isArray(g.sessions) ? g.sessions : [];
                g.students = Array.isArray(g.students) ? g.students : [];
                g.students.forEach(s => { s.id = s.id || uid(); s.payments = Array.isArray(s.payments) ? s.payments : []; s.since = s.since || ''; });
            });
            return raw;
        }
        // Ancien format (v1): présences stockées par élève, paiements = nombre de séances
        const out = { version: 2, groups: [] };
        raw.groups.forEach(og => {
            const g = { id: String(og.id || uid()), name: og.name || 'فوج', time: og.time || '', type: 'normal', price: PRICES.normal, students: [], sessions: [] };
            const sessionMap = new Map();
            (og.students || []).forEach(os => {
                const s = { id: uid(), name: os.name || '', since: '', payments: [] };
                const paid = +os.paid || 0;
                if (paid > 0) s.payments.push({ id: uid(), date: '', sessions: paid, amount: null, legacy: true });
                const seen = {};
                (os.records || []).forEach(r => {
                    const base = (r.date || '') + '|' + (r.topic || '');
                    seen[base] = (seen[base] || 0) + 1;
                    const key = base + '#' + seen[base];
                    if (!sessionMap.has(key)) sessionMap.set(key, { id: uid(), date: r.date || '', topic: r.topic || 'درس دعم', present: [] });
                    if (r.present) sessionMap.get(key).present.push(s.id);
                    if (r.date && (!s.since || r.date < s.since)) s.since = r.date;
                });
                g.students.push(s);
            });
            g.sessions = [...sessionMap.values()];
            out.groups.push(g);
        });
        return out;
    }

    let db;
    try { db = migrate(JSON.parse(localStorage.getItem(STORE_KEY))); } catch (e) { db = { version: 2, groups: [] }; }
    const openGroups = new Set();

    function saveData() {
        localStorage.setItem(STORE_KEY, JSON.stringify(db));
        render();
    }

    const findGroup = gid => db.groups.find(g => g.id === gid);
    const findStudent = (g, sid) => g.students.find(s => s.id === sid);
    const attendedCount = (g, s) => g.sessions.filter(x => x.present.includes(s.id)).length;
    const paidSessions = s => s.payments.reduce((a, p) => a + (+p.sessions || 0), 0);
    const sessionsSorted = g => [...g.sessions].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    /* ================= Render ================= */
    function render() {
        const q = $('search').value.trim().toLowerCase();
        const container = $('groups-container');
        let html = '', totalStudents = 0, totalSessions = 0;

        db.groups.forEach(g => {
            totalStudents += g.students.length;
            totalSessions += g.sessions.length;
            const students = q ? g.students.filter(s => s.name.toLowerCase().includes(q)) : g.students;
            if (q && !students.length) return;
            const isOpen = q ? true : openGroups.has(g.id);

            const studentsHtml = students.map(s => {
                const attended = attendedCount(g, s);
                const paid = paidSessions(s);
                const debt = attended - paid;
                const alert = debt >= 4;
                let badge;
                if (alert) badge = `<span class="debt-badge">🚨 ديون: ${debt} حصص (${money(debt * g.price / 4)})</span>`;
                else if (debt > 0) badge = `<span style="font-size:13px;color:var(--warning)">الديون: ${debt}</span>`;
                else if (debt < 0) badge = `<span style="font-size:13px;color:var(--success)">مدفوع مسبقاً: ${-debt}</span>`;
                else badge = `<span style="font-size:13px;color:var(--success)">✔ خالص</span>`;
                return `
                <div class="student-card ${alert ? 'debt-alert' : ''}">
                    <div class="student-header"><span>${esc(s.name)}</span>${badge}</div>
                    <div class="student-stats"><span>حضر: ${attended}</span><span>دفع: ${paid} حصص</span></div>
                    <div class="student-actions">
                        <button class="btn-pay" onclick="openPayModal('${g.id}','${s.id}')">💰 تسجيل دفع</button>
                        <button class="btn-action" onclick="showHistory('${g.id}','${s.id}')">السجل</button>
                        <button class="btn-action" onclick="openStudentModal('${g.id}','${s.id}')">✏️</button>
                        <button class="btn-danger" onclick="deleteStudent('${g.id}','${s.id}')">🗑️</button>
                    </div>
                </div>`;
            }).join('');

            html += `
            <div class="group-card">
                <div class="group-header" onclick="toggleGroup('${g.id}')">
                    <div>
                        <div class="group-title">${esc(g.name)}${g.time ? ' - ' + esc(g.time) : ''}</div>
                        <div class="group-meta"><span class="type-badge ${g.type === 'special' ? 'special' : ''}">${TYPE_LABEL[g.type] || ''}</span>${money(g.price)} / 4 حصص · ${g.students.length} تلميذ</div>
                    </div>
                    <span>${isOpen ? '▲' : '▼'}</span>
                </div>
                <div class="group-content ${isOpen ? 'active' : ''}">
                    <div class="group-controls">
                        <button class="btn-action" onclick="openStudentModal('${g.id}')">+ تلميذ</button>
                        <button class="btn-action" style="background:var(--neon-pink)" onclick="openAttendanceModal('${g.id}')">📝 حصة</button>
                        <button class="btn-action" onclick="showSessions('${g.id}')">📅 الحصص</button>
                        <button class="btn-action" onclick="printGroup('${g.id}')">🖨️ طباعة</button>
                        <button class="btn-action" onclick="openGroupModal('${g.id}')">✏️ تعديل</button>
                        <button class="btn-danger" onclick="deleteGroup('${g.id}')">🗑️ حذف</button>
                    </div>
                    ${studentsHtml || '<p class="empty">لا يوجد تلاميذ في هذا الفوج</p>'}
                </div>
            </div>`;
        });

        if (!html) html = q ? '<p class="empty">لا يوجد تلميذ بهذا الاسم</p>' : '<p class="empty">ابدأ بإضافة فوج جديد 👆</p>';
        container.innerHTML = html;

        $('total-students').innerText = totalStudents;
        $('total-sessions').innerText = totalSessions;
        const ym = today().slice(0, 7);
        $('month-revenue').innerText = String(Math.round(monthRevenue(ym))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        $('month-name').innerText = MONTHS[+ym.slice(5) - 1];
        renderBackupBanner(totalStudents);
    }

    function toggleGroup(gid) {
        openGroups.has(gid) ? openGroups.delete(gid) : openGroups.add(gid);
        render();
    }

    /* ================= Modal & toast ================= */
    let modalOpen = false;
    function showModal(title, body) {
        $('modal-title').innerText = title;
        $('modal-body').innerHTML = body;
        if (!modalOpen) { modalOpen = true; $('modal').classList.add('open'); history.pushState({ modal: true }, ''); }
        $('modal').querySelector('.modal-content').scrollTop = 0;
    }
    function closeModal() {
        if (!modalOpen) return;
        if (history.state && history.state.modal) history.back(); else hideModal();
    }
    function hideModal() { modalOpen = false; $('modal').classList.remove('open'); }
    // Le bouton retour d'Android ferme la fenêtre au lieu de quitter l'app
    window.addEventListener('popstate', () => { if (modalOpen) hideModal(); });

    let toastTimer;
    function toast(text, undoFn) {
        $('toast-text').innerText = text;
        const btn = $('toast-btn');
        btn.style.display = undoFn ? 'inline-block' : 'none';
        btn.onclick = () => { hideToast(); undoFn && undoFn(); };
        $('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, undoFn ? 6000 : 2500);
    }
    function hideToast() { $('toast').classList.remove('show'); }

    /* ================= Groups ================= */
    function openGroupModal(gid) {
        const g = gid ? findGroup(gid) : null;
        const type = g ? g.type : 'normal';
        showModal(g ? 'تعديل الفوج' : 'إضافة فوج', `
            <label class="field">اسم الفوج</label>
            <input type="text" id="g-name" placeholder="مثال: الفوج الأول" value="${g ? esc(g.name) : ''}">
            <label class="field">التوقيت</label>
            <input type="text" id="g-time" placeholder="مثال: السبت 09:00" value="${g ? esc(g.time) : ''}">
            <div class="row">
                <div>
                    <label class="field">نوع الفوج</label>
                    <select id="g-type" onchange="$('g-price').value = PRICES[this.value]">
                        <option value="normal" ${type === 'normal' ? 'selected' : ''}>عادي</option>
                        <option value="special" ${type === 'special' ? 'selected' : ''}>خاص</option>
                    </select>
                </div>
                <div>
                    <label class="field">السعر (4 حصص) دج</label>
                    <input type="number" id="g-price" inputmode="numeric" value="${g ? g.price : PRICES[type]}">
                </div>
            </div>
            <button class="btn-neon" onclick="saveGroup('${gid || ''}')">حفظ الفوج</button>`);
        if (!g) setTimeout(() => $('g-name').focus(), 50);
    }
    function saveGroup(gid) {
        const name = $('g-name').value.trim();
        if (!name) return alert('أدخل اسم الفوج!');
        const data = { name, time: $('g-time').value.trim(), type: $('g-type').value, price: +$('g-price').value || PRICES[$('g-type').value] };
        if (gid) Object.assign(findGroup(gid), data);
        else { const g = { id: uid(), ...data, students: [], sessions: [] }; db.groups.push(g); openGroups.add(g.id); }
        closeModal(); saveData();
    }
    function deleteGroup(gid) {
        const g = findGroup(gid);
        if (!confirm(`هل أنت متأكد من حذف "${g.name}" بالكامل مع ${g.students.length} تلميذ وكل الحصص والمدفوعات؟`)) return;
        db.groups = db.groups.filter(x => x.id !== gid);
        saveData();
    }

    /* ================= Students ================= */
    function openStudentModal(gid, sid) {
        const g = findGroup(gid);
        const s = sid ? findStudent(g, sid) : null;
        const moveOptions = s && db.groups.length > 1 ? `
            <label class="field">الفوج</label>
            <select id="s-group">${db.groups.map(x => `<option value="${x.id}" ${x.id === gid ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : '';
        showModal(s ? 'تعديل التلميذ' : 'إضافة تلميذ', `
            <label class="field">الاسم واللقب</label>
            <input type="text" id="s-name" placeholder="اسم التلميذ" value="${s ? esc(s.name) : ''}"
                   onkeydown="if(event.key==='Enter') saveStudent('${gid}','${sid || ''}')">
            ${moveOptions}
            <button class="btn-neon" onclick="saveStudent('${gid}','${sid || ''}')">${s ? 'حفظ' : 'إضافة'}</button>
            ${s ? '' : '<p class="muted" style="margin-top:10px">تقدر تزيد عدة تلاميذ وحدة بوحدة بلا ما تسكّر النافذة.</p>'}`);
        setTimeout(() => $('s-name').focus(), 50);
    }
    function saveStudent(gid, sid) {
        const name = $('s-name').value.trim();
        if (!name) return alert('أدخل اسم التلميذ!');
        const g = findGroup(gid);
        if (sid) {
            const s = findStudent(g, sid);
            s.name = name;
            const target = $('s-group') ? $('s-group').value : gid;
            if (target !== gid && confirm('نقل التلميذ لفوج آخر: سجل حضوره في هذا الفوج لن يظهر في الفوج الجديد، لكن المدفوعات تنتقل معه. متابعة؟')) {
                // garder le solde : les séances déjà suivies sont comptées comme un ajustement
                const att = attendedCount(g, s);
                if (att) s.payments.push({ id: uid(), date: today(), sessions: -att, amount: 0, note: 'نقل من ' + g.name });
                g.students = g.students.filter(x => x.id !== sid);
                g.sessions.forEach(x => x.present = x.present.filter(id => id !== sid));
                s.since = today();
                findGroup(target).students.push(s);
                openGroups.add(target);
            }
            closeModal(); saveData();
        } else {
            g.students.push({ id: uid(), name, since: today(), payments: [] });
            saveData();
            $('s-name').value = '';
            $('s-name').focus();
            toast('✔ تمت إضافة ' + name);
        }
    }
    function deleteStudent(gid, sid) {
        const g = findGroup(gid), s = findStudent(g, sid);
        if (!confirm(`هل أنت متأكد من حذف "${s.name}"؟`)) return;
        g.students = g.students.filter(x => x.id !== sid);
        g.sessions.forEach(x => x.present = x.present.filter(id => id !== sid));
        saveData();
    }

    /* ================= Payments ================= */
    function openPayModal(gid, sid) {
        const g = findGroup(gid), s = findStudent(g, sid);
        const debt = attendedCount(g, s) - paidSessions(s);
        showModal('تسجيل دفع: ' + s.name, `
            ${debt > 0 ? `<p class="muted" style="margin-bottom:12px">عليه ${debt} حصص ≈ ${money(debt * g.price / 4)}</p>` : ''}
            <div class="row">
                <div><label class="field">عدد الحصص</label>
                    <input type="number" id="p-sessions" inputmode="numeric" value="4" oninput="$('p-amount').value = Math.round((+this.value||0) * ${g.price} / 4)"></div>
                <div><label class="field">المبلغ (دج)</label>
                    <input type="number" id="p-amount" inputmode="numeric" value="${g.price}"></div>
            </div>
            <label class="field">التاريخ</label>
            <input type="date" id="p-date" value="${today()}">
            <button class="btn-neon" style="background:var(--success);box-shadow:none" onclick="savePayment('${gid}','${sid}')">✔ تأكيد الدفع</button>`);
    }
    function savePayment(gid, sid) {
        const sessions = +$('p-sessions').value;
        if (!sessions || sessions < 1) return alert('أدخل عدد الحصص!');
        const s = findStudent(findGroup(gid), sid);
        const p = { id: uid(), date: $('p-date').value || today(), sessions, amount: +$('p-amount').value || 0 };
        s.payments.push(p);
        openGroups.add(gid);
        closeModal(); saveData();
        toast(`✔ دفع ${money(p.amount)}`, () => { s.payments = s.payments.filter(x => x.id !== p.id); saveData(); toast('تم إلغاء الدفع'); });
    }
    function deletePayment(gid, sid, pid) {
        if (!confirm('حذف هذا الدفع؟')) return;
        const s = findStudent(findGroup(gid), sid);
        s.payments = s.payments.filter(p => p.id !== pid);
        saveData();
        showHistory(gid, sid);
    }
    function monthRevenue(ym) {
        let total = 0;
        db.groups.forEach(g => g.students.forEach(s => s.payments.forEach(p => { if (p.amount && (p.date || '').startsWith(ym)) total += p.amount; })));
        return total;
    }
    function showRevenue() {
        const months = {};
        db.groups.forEach(g => g.students.forEach(s => s.payments.forEach(p => {
            if (!p.amount || !p.date) return;
            const ym = p.date.slice(0, 7);
            months[ym] = months[ym] || { total: 0, count: 0 };
            months[ym].total += p.amount; months[ym].count++;
        })));
        const keys = Object.keys(months).sort().reverse();
        let totalDebt = 0;
        db.groups.forEach(g => g.students.forEach(s => { const d = attendedCount(g, s) - paidSessions(s); if (d > 0) totalDebt += d * g.price / 4; }));
        showModal('💰 المداخيل', `
            <div class="summary" style="grid-template-columns:1fr 1fr">
                <div><b>${money(monthRevenue(today().slice(0, 7)))}</b>هذا الشهر</div>
                <div><b style="color:var(--neon-pink)">${money(totalDebt)}</b>ديون غير مدفوعة</div>
            </div>
            ${keys.length ? `<table><tr><th>الشهر</th><th>عدد الدفعات</th><th>المبلغ</th></tr>
                ${keys.map(k => `<tr><td>${monthLabel(k)}</td><td>${months[k].count}</td><td>${money(months[k].total)}</td></tr>`).join('')}</table>`
                : '<p class="empty">لا توجد مدفوعات مسجلة بعد</p>'}`);
    }

    /* ================= Sessions ================= */
    function openAttendanceModal(gid, sessionId) {
        const g = findGroup(gid);
        if (!g.students.length) return alert('الفوج فارغ!');
        const ses = sessionId ? g.sessions.find(x => x.id === sessionId) : null;
        const list = g.students.map(s => `
            <label class="att-item"><span>${esc(s.name)}</span>
                <input type="checkbox" class="att-chk" value="${s.id}" ${ses && ses.present.includes(s.id) ? 'checked' : ''}></label>`).join('');
        showModal(ses ? 'تعديل الحصة' : 'تسجيل حصة', `
            <label class="field">التاريخ</label>
            <input type="date" id="a-date" value="${ses ? ses.date : today()}">
            <label class="field">موضوع الدرس</label>
            <input type="text" id="a-topic" placeholder="مثال: تسوية التثبيتات" value="${ses ? esc(ses.topic) : ''}">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <span class="muted">الحاضرون: <b id="att-count">0</b> / ${g.students.length}</span>
                <button class="btn-ghost" onclick="toggleAll()">تحديد الكل</button>
            </div>
            <div id="attendance-list" style="margin: 10px 0;" onchange="updateAttCount()">${list}</div>
            <button class="btn-neon" onclick="saveAttendance('${gid}','${sessionId || ''}')">حفظ الحضور</button>
            ${ses ? `<button class="btn-danger" style="width:100%;margin-top:10px" onclick="deleteSession('${gid}','${sessionId}')">🗑️ حذف هذه الحصة</button>` : ''}`);
        updateAttCount();
    }
    function updateAttCount() { $('att-count').innerText = document.querySelectorAll('.att-chk:checked').length; }
    function toggleAll() {
        const boxes = [...document.querySelectorAll('.att-chk')];
        const all = boxes.every(b => b.checked);
        boxes.forEach(b => b.checked = !all);
        updateAttCount();
    }
    function saveAttendance(gid, sessionId) {
        const g = findGroup(gid);
        const date = $('a-date').value;
        if (!date) return alert('اختر التاريخ!');
        const dup = g.sessions.find(x => x.date === date && x.id !== sessionId);
        if (dup && !confirm('توجد حصة مسجلة بنفس التاريخ في هذا الفوج. هل تريد تسجيل حصة ثانية؟')) return;
        const data = { date, topic: $('a-topic').value.trim() || 'درس دعم', present: [...document.querySelectorAll('.att-chk:checked')].map(b => b.value) };
        if (sessionId) Object.assign(g.sessions.find(x => x.id === sessionId), data);
        else g.sessions.push({ id: uid(), ...data });
        openGroups.add(gid);
        closeModal(); saveData();
        toast(sessionId ? '✔ تم تعديل الحصة' : `✔ تم تسجيل الحصة (${data.present.length} حاضر)`);
    }
    function deleteSession(gid, sessionId) {
        if (!confirm('حذف هذه الحصة نهائياً؟')) return;
        const g = findGroup(gid);
        g.sessions = g.sessions.filter(x => x.id !== sessionId);
        saveData();
        showSessions(gid);
    }
    function showSessions(gid) {
        const g = findGroup(gid);
        const list = sessionsSorted(g).map(x => `
            <div class="list-item" onclick="openAttendanceModal('${gid}','${x.id}')">
                <div><b>${x.date || '—'}</b><div class="muted">${esc(x.topic)}</div></div>
                <span class="muted">${x.present.length} حاضر ✏️</span>
            </div>`).join('');
        showModal('📅 حصص ' + g.name, list || '<p class="empty">لا توجد حصص مسجلة</p>');
    }

    /* ================= History ================= */
    function showHistory(gid, sid) {
        const g = findGroup(gid), s = findStudent(g, sid);
        const attended = attendedCount(g, s), paid = paidSessions(s);
        const totalAmount = s.payments.reduce((a, p) => a + (p.amount > 0 ? p.amount : 0), 0);
        const sessions = sessionsSorted(g).filter(x => !s.since || !x.date || x.date >= s.since || x.present.includes(s.id));
        const rows = sessions.map(x => {
            const p = x.present.includes(s.id);
            return `<tr><td>${x.date}</td><td>${esc(x.topic)}</td><td style="color:${p ? 'var(--success)' : 'var(--danger)'}">${p ? 'حاضر ✅' : 'غائب ❌'}</td></tr>`;
        }).join('');
        const pays = [...s.payments].sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(p => `
            <tr><td>${p.date || 'قديم'}</td><td>${p.sessions} حصص${p.note ? `<div class="muted">${esc(p.note)}</div>` : ''}</td>
            <td>${p.amount == null ? '—' : money(p.amount)}</td>
            <td><button class="btn-danger" style="padding:4px 8px" onclick="deletePayment('${gid}','${sid}','${p.id}')">🗑️</button></td></tr>`).join('');
        showModal('سجل: ' + s.name, `
            <div class="summary">
                <div><b>${attended}</b>حصص حضرها</div>
                <div><b>${paid}</b>حصص مدفوعة</div>
                <div><b>${money(totalAmount)}</b>مجموع الدفع</div>
            </div>
            <h4>المدفوعات</h4>
            ${pays ? `<table><tr><th>التاريخ</th><th>الحصص</th><th>المبلغ</th><th></th></tr>${pays}</table>` : '<p class="empty">لا توجد مدفوعات</p>'}
            <h4>الحضور</h4>
            ${rows ? `<table><tr><th>التاريخ</th><th>الموضوع</th><th>الحالة</th></tr>${rows}</table>` : '<p class="empty">لا توجد حصص مسجلة</p>'}`);
    }

    /* ================= Print ================= */
    function printGroup(gid) {
        const g = findGroup(gid);
        $('print-title').innerText = g.name + (g.time ? ' - ' + g.time : '');
        $('print-tbody').innerHTML = g.students.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name)}</td><td></td></tr>`).join('');
        window.print();
    }

    /* ================= Backup & Restore ================= */
    function backupName(ext) { return 'Gestion_Backup_' + today() + '.' + ext; }
    function markBackup() { localStorage.setItem(BACKUP_KEY, Date.now()); render(); }
    function openBackupModal() {
        const canShare = !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'a.txt', { type: 'text/plain' })] }));
        showModal('💾 نسخة احتياطية', `
            <p class="muted" style="margin-bottom:12px">احتفظ بالنسخة في مكان آمن خارج الهاتف (واتساب، درايف، إيميل) باش ما تضيعش بياناتك.</p>
            ${canShare ? '<button class="btn-neon" onclick="shareBackup()">📤 إرسال (واتساب / درايف / إيميل)</button>' : ''}
            <button class="btn-neon" style="background:#333;box-shadow:none" onclick="downloadBackup()">⬇️ تحميل في الهاتف</button>`);
    }
    async function shareBackup() {
        const file = new File([JSON.stringify(db)], backupName('txt'), { type: 'text/plain' });
        try {
            await navigator.share({ files: [file], title: 'نسخة احتياطية - أستاذ الشارع' });
            closeModal(); markBackup(); toast('✔ تم إرسال النسخة');
        } catch (e) {
            if (e.name !== 'AbortError') downloadBackup();
        }
    }
    function downloadBackup() {
        const blob = new Blob([JSON.stringify(db)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = backupName('json');
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        closeModal(); markBackup(); toast('✔ تم التحميل في مجلد التنزيلات');
    }
    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            event.target.value = '';
            let data;
            try { data = migrate(JSON.parse(e.target.result)); }
            catch (err) { return alert('عذراً، هذا الملف ليس نسخة احتياطية صالحة! لم يتم تغيير أي شيء.'); }
            const nNew = data.groups.reduce((a, g) => a + g.students.length, 0);
            const nOld = db.groups.reduce((a, g) => a + g.students.length, 0);
            if (!confirm(`النسخة المسترجعة فيها ${data.groups.length} فوج و ${nNew} تلميذ.\nسيتم استبدال البيانات الحالية (${nOld} تلميذ). متابعة؟`)) return;
            localStorage.setItem(STORE_KEY + '_prev', JSON.stringify(db));
            db = data;
            saveData();
            alert('تم استرجاع البيانات بنجاح!');
        };
        reader.readAsText(file);
    }
    function renderBackupBanner(totalStudents) {
        const last = +localStorage.getItem(BACKUP_KEY) || 0;
        const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
        const show = totalStudents > 0 && (days === null || days >= 7);
        $('backup-banner').innerHTML = show ? `
            <div class="banner"><span>⚠️ ${days === null ? 'لم تقم بأي نسخة احتياطية بعد' : 'آخر نسخة احتياطية منذ ' + days + ' يوم'}</span>
            <button onclick="openBackupModal()">حفظ الآن</button></div>` : '';
    }

    /* ================= App install & offline ================= */
    let installEvent = null;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; $('installBtn').style.display = 'block'; });
    window.addEventListener('appinstalled', () => { $('installBtn').style.display = 'none'; });
    async function installApp() {
        if (!installEvent) return;
        installEvent.prompt();
        await installEvent.userChoice;
        installEvent = null; $('installBtn').style.display = 'none';
    }
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
    // Demande au téléphone de ne jamais effacer les données de l'app
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

    render();
    </script>
</body>
</html>
